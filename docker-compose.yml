version: '3.8'

services:
  postgres:
    image: postgres:18
    container_name: spisok_vuzov_db
    environment:
      POSTGRES_DB: spisok_vuzov
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: